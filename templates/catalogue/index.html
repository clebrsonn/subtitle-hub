<h1>Subtitle Hub</h1>
<form action="/search/" method="get">
  <input type="text" name="anidb" placeholder="AniDB ID">
  <input type="text" name="tmdb_tv" placeholder="TMDB TV ID">
  <input type="text" name="tmdb_movie" placeholder="TMDB Movie ID">
  <input type="text" name="tvdb" placeholder="TVDB ID">
  <input type="text" name="title" placeholder="Title Search">
  <input type="text" name="language" placeholder="Language (e.g. pt-BR)">
  <input type="text" name="release" placeholder="Release Group">
  <button type="submit">Search</button>
</form>
