version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: subtitle_hub
      POSTGRES_USER: hub_user
      POSTGRES_PASSWORD: hub_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_user -d subtitle_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn subtitle_hub.wsgi:application --bind 127.0.0.1:8000"
    volumes:
      - .:/app
      - ./managed_media:/app/managed_media
      - ./source_media:/app/source_media:ro
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgres://hub_user:hub_password@db:5432/subtitle_hub
      - DEBUG=True
      - SECRET_KEY=dummy-secret-key-for-dev-only
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
